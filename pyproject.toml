[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "avap"
version = "1.0.0"
description = "Agent Video Attestation Protocol - signed, blockchain-anchored agent-to-agent information transfer embedded in video files"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "Scott (Elyan Labs)" }]
keywords = ["ai-agents", "video", "attestation", "blockchain", "rustchain",
            "provenance", "ed25519", "agent-to-agent", "c2pa"]
dependencies = ["pynacl>=1.5.0"]

[project.optional-dependencies]
node = ["requests>=2.25"]
dev = ["requests>=2.25", "pytest>=7", "ruff>=0.4"]

[project.scripts]
avap = "avap.cli:main"

[project.urls]
Homepage = "https://github.com/Scottcjn/agent-video-attestation"
Source = "https://github.com/Scottcjn/agent-video-attestation"

[tool.setuptools]
packages = ["avap"]

# Pin the lint rule set explicitly. CI installs the newest ruff on every run;
# newer ruff releases enable many more rules by default, which turned main red
# without any code change. These are the rules the code was written against
# (ruff's long-standing default set). Widen deliberately, in its own PR.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
